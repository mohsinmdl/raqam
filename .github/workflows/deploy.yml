# Auto-deploy to Cloudflare Pages (project "raqam", direct-upload mode).
#   push to main       -> production deploy (raqam.pages.dev); PR merges land
#                         as pushes to main, so merging a PR is what deploys
#   workflow_dispatch  -> manual production deploy (explicit human trigger)
#
# PRs deliberately do NOT deploy previews — production ships only from main.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN     token with "Cloudflare Pages: Edit" permission
#   VITE_SUPABASE_URL        baked into the bundle at build time
#   VITE_SUPABASE_ANON_KEY   publishable anon key (safe in the bundle; RLS guards data)
# Variables (optional; Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_AI_ENDPOINT         Modal AI service URL (public-class, like the anon key).
#                            When unset the AI features simply stay hidden (the
#                            in-app toggle reads "Unavailable"); set it to light
#                            them up, then they remain default-OFF per user.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Public-class Modal AI endpoint; empty when the Actions variable is
          # unset -> AI features stay hidden (aiConfigured() is false).
          VITE_AI_ENDPOINT: ${{ vars.VITE_AI_ENDPOINT }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7cd620c99fe1fdf94f01b938c0bc672a
          command: pages deploy dist --project-name=raqam --branch=main
